name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Eval (rule-only)
        run: |
          python scripts/generate_dirty_data.py --rows 2000 --out /tmp/eval
          python scripts/evaluate.py --data /tmp/eval/customers_dirty.csv --truth /tmp/eval/ground_truth.csv
