# Production-style stack. Only Caddy is reachable from the internet (ports 80/443).
# Postgres and the API have no published ports. Raw files (bronze) live on a Docker volume;
# set BRONZE_BACKEND=s3 to use any S3-compatible service instead.
x-airflow-common: &airflow-common
  build: ./airflow
  image: smartingest-airflow:3.3.2
  restart: unless-stopped
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?set in .env}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set in .env}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set in .env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Jakarta
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__API__WORKERS: "1"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    PYTHONPATH: /opt/airflow/dags
    RETAILKU_LANDING: /opt/airflow/landing
    AIRFLOW_CONN_SMARTINGEST_API: '{"conn_type": "http", "host": "api", "port": 8000, "password": "${ADMIN_API_KEY:?set in .env}"}'
    DBT_HOST: postgres
    DBT_DBNAME: ${POSTGRES_DB:-smartingest}
    DBT_USER: smartingest_dbt
    DBT_ENV_SECRET_PASSWORD: ${DBT_DB_PASSWORD:?set in .env}
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./dbt:/opt/airflow/dbt:ro
    - airflow_logs:/opt/airflow/logs
    - landing:/opt/airflow/landing
  depends_on:
    postgres: {condition: service_healthy}
  networks: [internal]

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (use :80 to test on a laptop)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [edge]

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://smartingest_app:${APP_DB_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:-smartingest}
      BRONZE_BACKEND: ${BRONZE_BACKEND:-local}
      BRONZE_LOCAL_PATH: /data/bronze
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SMARTINGEST_FAST_MODEL: ${SMARTINGEST_FAST_MODEL:-claude-haiku-4-5-20251001}
      SMARTINGEST_SMART_MODEL: ${SMARTINGEST_SMART_MODEL:-claude-sonnet-5-5}
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_LLM_ENABLED: ${DEMO_LLM_ENABLED:-true}
      LLM_DAILY_CALL_LIMIT: ${LLM_DAILY_CALL_LIMIT:-300}
    expose: ["8000"]
    volumes: [bronze:/data/bronze]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 1g
    depends_on:
      postgres: {condition: service_healthy}
    networks: [edge, internal]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartingest_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-smartingest}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
      DBT_DB_PASSWORD: ${DBT_DB_PASSWORD:?set in .env}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./sql/02_app_role.sh:/docker-entrypoint-initdb.d/02_app_role.sh:ro
      - ./sql/03_gold_and_airflow.sh:/docker-entrypoint-initdb.d/03_gold_and_airflow.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartingest_admin} -d ${POSTGRES_DB:-smartingest}"]
      interval: 5s
      retries: 10
    networks: [internal]

  # --- Phase 2: Airflow orchestration + dbt gold layer ---
  airflow-init:
    <<: *airflow-common
    command: version
    restart: "no"
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set in .env}

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports: ["127.0.0.1:8080:8080"]
    networks: [internal, edge]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init: {condition: service_completed_successfully}

networks:
  edge:
  internal:
    internal: true   # no route to the internet from here

volumes:
  pgdata:
  bronze:
  caddy_data:
  caddy_config:
  airflow_logs:
  landing: