# Gold layer for SmartIngest. Reads silver (validated rows) and meta (batch + issue metadata),
# writes two schemas: staging (views, cleaned names, de-duplicated) and gold (tables for dashboards).
name: smartingest_gold
version: "1.0.0"
profile: smartingest

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

flags:
  send_anonymous_usage_stats: false

models:
  smartingest_gold:
    staging:
      +schema: staging
      +materialized: view
    gold:
      +schema: gold
      +materialized: table
